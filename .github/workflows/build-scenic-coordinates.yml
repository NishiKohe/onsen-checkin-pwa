name: Audit scenic catalog

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-scenic-coordinates.yml"
      - "scripts/audit_scenic_online.py"
      - "data/scenic-national-v70.json"
      - "data/scenic-shards-v70.json"
      - "data/scenic-ordinary-*.json"

permissions:
  contents: write

concurrency:
  group: audit-scenic-catalog
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Audit current national scenic catalog
        run: python scripts/audit_scenic_online.py

      - name: Show audit summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/scenic-catalog-audit-v70.json').read_text(encoding='utf-8'))
          print('repoRawRows=',d['repoRawRows'])
          print('repoUniqueIds=',d['repoUniqueIds'])
          print('repoDuplicateIds=',list(d['repoDuplicateIds']))
          print('onlineDesignatedScenicTotal=',d['onlineDesignatedScenicTotal'])
          print('onlineOrdinaryScenic=',d['onlineOrdinaryScenic'])
          print('onlineSpecialScenic=',d['onlineSpecialScenic'])
          print('onlineRegisteredScenicExcluded=',d['onlineRegisteredScenicExcluded'])
          print('missingInRepo=',len(d['missingInRepo']))
          for row in d['missingInRepo']:
              print(' +',row['kind'],row['name'],row.get('detailUrl'))
          print('extraInRepo=',len(d['extraInRepo']))
          for row in d['extraInRepo']:
              print(' -',row['name'],row['id'],row['source'])
          PY

      - name: Commit audit report
        run: |
          git add -f data/scenic-catalog-audit-v70.json
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit national scenic catalog"
          git push
