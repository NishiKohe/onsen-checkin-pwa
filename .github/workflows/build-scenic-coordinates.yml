name: Inspect official scenic CSV

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-scenic-coordinates.yml"

permissions:
  contents: read

concurrency:
  group: inspect-scenic-database
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Inspect CSV export
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          base='https://kunishitei.bunka.go.jp'
          category=base+'/bsys/categorylist?register_id=401'
          s=requests.Session(); s.headers.update({'User-Agent':'onsen-checkin-pwa official scenic importer/1.0'})
          g=s.get(category,timeout=30); g.raise_for_status(); soup=BeautifulSoup(g.text,'html.parser')
          first=soup.find('form', string=lambda x: False)
          token=soup.find('input',{'name':'_csrfToken'})['value']
          def do(kind):
              data={'_method':'POST','_csrfToken':token,'register_sub_id':'401','kind_page_check':'史跡名勝天然記念物','entry_kind1_401[]':kind,'sortTarget':'','sortType':''}
              r=s.post(base+'/bsys/searchlist',data=data,timeout=30); r.raise_for_status()
              rs=BeautifulSoup(r.text,'html.parser')
              csv_form=None
              for f in rs.find_all('form'):
                  if (f.get('action') or '')=='/utile/csv-list': csv_form=f; break
              assert csv_form is not None, 'csv form not found'
              payload={}
              for node in csv_form.find_all('input'):
                  name=node.get('name')
                  if name: payload.setdefault(name,[]).append(node.get('value',''))
              post=[]
              for k,vals in payload.items():
                  for v in vals: post.append((k,v))
              c=s.post(base+'/utile/csv-list',data=post,timeout=60,allow_redirects=True)
              print('KIND',kind,'STATUS',c.status_code,'FINAL',c.url,'LEN',len(c.content))
              print('CONTENT-TYPE',c.headers.get('content-type'))
              print('DISPOSITION',c.headers.get('content-disposition'))
              print('ENCODING',c.encoding,'APPARENT',c.apparent_encoding)
              raw=c.content[:3000]
              for enc in ['utf-8-sig','cp932','shift_jis','utf-8']:
                  try:
                      text=raw.decode(enc)
                      print('DECODE',enc,'OK')
                      print(text[:2500].replace('\x00','<NUL>'))
                      break
                  except Exception as e:
                      print('DECODE',enc,'FAIL',type(e).__name__)
          do('名勝')
          # Refresh category page for a fresh CSRF/session state before special-scenic export.
          g=s.get(category,timeout=30); g.raise_for_status(); soup=BeautifulSoup(g.text,'html.parser'); token=soup.find('input',{'name':'_csrfToken'})['value']
          do('特別名勝')
          PY
