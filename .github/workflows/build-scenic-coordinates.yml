name: Build official scenic master

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-scenic-coordinates.yml"
      - "scripts/import_scenic_official.py"
      - "scripts/promote_scenic_single_reference_v71.py"
      - "data/scenic-national-v70.json"
      - "data/scenic-shards-v70.json"
      - "data/scenic-ordinary-*.json"

permissions:
  contents: write

concurrency:
  group: build-official-scenic-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Import official scenic CSV
        run: python scripts/import_scenic_official.py

      - name: Promote reviewed single-reference sites
        run: python scripts/promote_scenic_single_reference_v71.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          master=json.loads(Path('data/scenic-official-v71.json').read_text(encoding='utf-8'))
          zones=json.loads(Path('data/scenic-checkin-zones-v71.json').read_text(encoding='utf-8'))
          ids=[e['id'] for e in master['entries']]
          enabled=[e for e in zones['entries'] if e.get('checkinEnabled')]
          assert master['counts']['ordinary']==397
          assert master['counts']['special']==36
          assert master['counts']['total']==433
          assert len(ids)==433 and len(set(ids))==433
          assert len(zones['entries'])==433
          assert len(enabled)==zones['counts']['gpsEnabled']
          assert len(enabled)>=202
          assert zones['counts']['pendingMultiZoneOrAudit']==433-len(enabled)
          assert all(e.get('zones') for e in enabled)
          assert all(all(float(z['radiusM'])>=500 for z in e.get('zones',[])) for e in zones['entries'])
          assert all(all(float(z['accuracyRequiredM'])>=500 for z in e.get('zones',[])) for e in zones['entries'])
          print('MASTER COUNTS',master['counts'])
          print('LEGACY MATCH',master['legacyMatchCounts'])
          print('ZONE COUNTS',zones['counts'])
          print('SINGLE REFERENCE PROMOTION',zones.get('singleReferencePromotion',{}).get('promotedCount',0))
          PY

      - name: Commit generated official data
        run: |
          git add -f data/scenic-official-v71.json data/scenic-checkin-zones-v71.json
          if git diff --cached --quiet; then
            echo "No official scenic data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate official scenic v71 data"
          git push
