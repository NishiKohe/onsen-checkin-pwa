name: Inspect official scenic database

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-scenic-coordinates.yml"

permissions:
  contents: read

concurrency:
  group: inspect-scenic-database
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Inspect official database form
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://kunishitei.bunka.go.jp/bsys/categorylist?register_id=401'
          s=requests.Session()
          s.headers.update({'User-Agent':'onsen-checkin-pwa official scenic importer/1.0'})
          r=s.get(url,timeout=30)
          print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.text))
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          print('FORMS',len(soup.find_all('form')))
          for i,form in enumerate(soup.find_all('form')):
              print('FORM',i,'action=',form.get('action'),'method=',form.get('method'),'id=',form.get('id'),'name=',form.get('name'))
              for node in form.find_all(['input','button','select']):
                  typ=node.get('type') or node.name
                  name=node.get('name')
                  value=node.get('value')
                  text=' '.join(node.stripped_strings)[:80]
                  if name or value or text:
                      print(' FIELD',typ,'name=',name,'value=',value,'id=',node.get('id'),'text=',text)
                      if node.name=='select' and name:
                          opts=[]
                          for o in node.find_all('option'):
                              label=' '.join(o.stripped_strings)
                              if '名勝' in label or '史跡' in label or '天然' in label:
                                  opts.append((o.get('value'),label))
                          if opts: print('  OPTIONS',opts)
          print('SCRIPTS')
          for script in soup.find_all('script',src=True):
              print(urljoin(url,script['src']))
          print('LINKS containing csv/search/list')
          for a in soup.find_all('a',href=True):
              href=a.get('href','')
              text=' '.join(a.stripped_strings)
              if any(k in (href+text).lower() for k in ['csv','search','list','download']):
                  print(text[:80],urljoin(url,href))
          PY
