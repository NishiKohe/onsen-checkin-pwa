name: Map and collection UX v73.9 mobile browser

on:
  workflow_dispatch:
  push:
    paths:
      - "map-discovery-v737.js"
      - "map-detail-compact-v737.js"
      - "map-ux-v737.css"
      - "map-clusters-v738.js"
      - "map-clusters-v738.css"
      - "collection-pref-fold-v737.js"
      - "collection-pref-fold-v737.css"
      - "scripts/test-map-clusters-browser-v738.cjs"
      - "scripts/debug-map-clusters-v738.cjs"
      - ".github/workflows/map-ux-browser-v737.yml"
      - "build-info.js"
      - "sw.js"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check map-discovery-v737.js
          node --check map-detail-compact-v737.js
          node --check map-clusters-v738.js
          node --check collection-pref-fold-v737.js
          node --check build-info.js
          node --check sw.js
          node --check scripts/test-map-clusters-browser-v738.cjs
          node --check scripts/debug-map-clusters-v738.cjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture published aggregation diagnostics
        run: node scripts/debug-map-clusters-v738.cjs
      - name: Verify published mobile aggregation and original pins
        run: node scripts/test-map-clusters-browser-v738.cjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: map-clusters-v738-failure
          path: map-clusters-v738-failure.png
          if-no-files-found: ignore
