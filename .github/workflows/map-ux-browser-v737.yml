name: Map and collection UX v73.10 mobile browser
# v73.10 DOM aggregation

on:
  workflow_dispatch:
  push:
    paths:
      - "past-visit-checklist.js"
      - "scripts/test-past-visit-checklist.cjs"
      - "map-discovery-v737.js"
      - "map-detail-compact-v737.js"
      - "map-ux-v737.css"
      - "unified-checkin-v7311.js"
      - "scripts/test-unified-checkin-v7311.cjs"
      - "scripts/test-unified-checkin-browser-v7311.cjs"
      - "map-clusters-v738.js"
      - "map-clusters-v738.css"
      - "collection-pref-fold-v737.js"
      - "collection-pref-fold-v737.css"
      - "scripts/test-map-clusters-browser-v738.cjs"
      - "scripts/test-map-ux-browser-v737.cjs"
      - "scripts/debug-map-clusters-v738.cjs"
      - ".github/workflows/map-ux-browser-v737.yml"
      - "build-info.js"
      - "sw.js"

concurrency:
  group: map-ux-browser-v7310
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check map-discovery-v737.js
          node --check map-detail-compact-v737.js
          node --check unified-checkin-v7311.js
          node scripts/test-unified-checkin-v7311.cjs
          node --check scripts/test-map-ux-browser-v737.cjs
          node --check map-clusters-v738.js
          node --check collection-pref-fold-v737.js
          node --check build-info.js
          node --check sw.js
          node --check scripts/test-map-clusters-browser-v738.cjs
          node --check scripts/debug-map-clusters-v738.cjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site for current commit
        run: python3 -m http.server 8765 >/tmp/onsen-http.log 2>&1 &
      - name: Verify current commit on mobile browser
        env:
          ONSEN_TEST_BASE_URL: http://127.0.0.1:8765/
        run: |
          node scripts/test-map-clusters-browser-v738.cjs
          node scripts/test-map-ux-browser-v737.cjs
          node scripts/test-unified-checkin-browser-v7311.cjs
          node scripts/test-past-visit-checklist.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-clusters-v738-failure
          path: |
            *-failure.png
            unified-checkin-mobile.png
            unified-checkin-result.png
            past-visit-checklist-mobile.png
          if-no-files-found: ignore
