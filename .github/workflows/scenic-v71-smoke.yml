name: Canonical scenic renderer and collections v73.4 smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "map-domain-controller-v733.js"
      - "collection-domain-controller-v732.js"
      - "collection-domain-controller-v732.css"
      - "castle-map-v62.js"
      - "scenic-map-v71.js"
      - "scenic-map-renderer-v734.js"
      - "travel-domain-recovery-v728.js"
      - "photo-exif-runtime-v731.js"
      - "trip-manual-recovery-v731.js"
      - "trip-photo-recovery-v731.js"
      - "scenic-runtime-v70.js"
      - "achievement-domain-controller-v721.js"
      - "achievement-domain-v702.js"
      - "data/scenic-*.json"
      - "data/castle-checkin-zones-v62.json"
      - "data/castles-zoku100-v68.csv"
      - "build-info.js"
      - "sw.js"
      - ".github/workflows/scenic-v71-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check map-domain-controller-v733.js
          node --check collection-domain-controller-v732.js
          node --check castle-map-v62.js
          node --check scenic-map-v71.js
          node --check scenic-map-renderer-v734.js
          node --check travel-domain-recovery-v728.js
          node --check photo-exif-runtime-v731.js
          node --check trip-manual-recovery-v731.js
          node --check trip-photo-recovery-v731.js
          node --check scenic-runtime-v70.js
          node --check build-info.js
          node --check sw.js

      - name: GPS catalogs remain complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          master=json.loads(Path('data/scenic-official-v71.json').read_text())
          zones=json.loads(Path('data/scenic-checkin-zones-v71.json').read_text())
          supplement=json.loads(Path('data/scenic-checkin-supplement-v727.json').read_text())
          audit=json.loads(Path('data/scenic-checkin-audit-v72.json').read_text())
          multi=json.loads(Path('data/scenic-checkin-multizone-v724.json').read_text())
          assert master['counts']['total']==433 and len(master['entries'])==433
          effective={str(e['scenicId']):dict(e) for e in zones['entries']}
          for e in effective.values():
              if not e.get('checkinEnabled') and e.get('coordinateStatus')=='official_csv' and e.get('zones'): e['checkinEnabled']=True
          for layer in (supplement['entries'],audit['entries'],multi['entries']):
              for o in layer: effective[str(o['scenicId'])]={**effective[str(o['scenicId'])],**o}
          enabled=[e for e in effective.values() if e.get('checkinEnabled') and e.get('zones')]
          assert len(enabled)==433
          for e in enabled:
              for z in e['zones']:
                  assert float(z['radiusM'])>=500 and float(z['accuracyRequiredM'])>=500
          assert len(json.loads(Path('data/castle-checkin-zones-v62.json').read_text())['entries'])==100
          assert len([x for x in Path('data/castles-zoku100-v68.csv').read_text().splitlines()[1:] if x.strip()])==100
          print('GPS catalogs OK: scenic 433/433, castles 200')
          PY

      - name: Scenic renderer guards
        run: |
          python - <<'PY'
          from pathlib import Path
          renderer=Path('scenic-map-renderer-v734.js').read_text()
          build=Path('build-info.js').read_text()
          router=Path('map-domain-controller-v733.js').read_text()
          scenic=Path('scenic-map-v71.js').read_text()
          for required in [
              'const BUILD = "v73.4"',
              'const SOURCE = "scenic-v734-source"',
              'const POINTS = "scenic-v734-points"',
              'type: "circle"',
              'for (const entry of rt.entries())',
              'rt.referenceZones(entry)',
              'lastFeatureCount = features.length',
              'lastFeatureCount === 433',
              'window.OnsenScenicRendererV734',
              'for (const id of LEGACY_POINTS) setVisibility(id, false)',
              'window.OnsenScenicMapV71?.select?.(id, { fly: false })'
          ]:
              assert required in renderer, required
          for required in [
              'async function ensureScenicRuntime',
              'async function ensureScenicAdapter',
              'async function ensureScenicRenderer',
              './scenic-runtime-v70.js?v=73.4',
              './scenic-map-v71.js?v=73.4',
              './scenic-map-renderer-v734.js?v=73.4',
              'window.OnsenScenicRendererV734?.featureCount?.()===433',
              'onsen-critical-bootstrap-v734-ready'
          ]:
              assert required in build, required
          assert build.index('const scenic=await ensureScenicAdapter()') < build.index('const renderer=await ensureScenicRenderer()') < build.index('./collection-domain-controller-v732.js?v=73.4')
          assert 'const BUILD = "v73.3"' in router
          assert 'const BUILD = "v73"' in scenic and 'function ensureLayers' in scenic and 'function setControllerActive' in scenic
          print('v73.4 canonical scenic renderer guards OK')
          PY

      - name: Three-domain trip recovery guards
        run: |
          python - <<'PY'
          from pathlib import Path
          recovery=Path('travel-domain-recovery-v728.js').read_text(); exif=Path('photo-exif-runtime-v731.js').read_text(); manual=Path('trip-manual-recovery-v731.js').read_text(); photo=Path('trip-photo-recovery-v731.js').read_text()
          for text in (recovery,exif,manual,photo): assert 'const BUILD = "v73.1"' in text
          for required in ['entityType==="onsen"?confirmOnsen','photo_verified_range','OnsenMapDomainV73?.open?.','upsertCandidate','window.OnsenTravelDomainRecoveryV731']:
              assert required in recovery, required
          for required in ['tripManualDomainV731','<option value="onsen">','<option value="castle">','<option value="scenic">','registerPastVisit']:
              assert required in manual, required
          for required in ['nearestOnsen','nearestCastles','nearestScenic','PHOTO_NEARBY_MARGIN_M = 1000','photo_verified_range','photo_nearby','upsertCandidate']:
              assert required in photo, required
          assert 'saveState(' not in photo and 'saveCheckins(' not in photo
          print('v73.1 trip recovery guards OK')
          PY

      - name: Unified collection guards
        run: |
          python - <<'PY'
          from pathlib import Path
          common=Path('collection-domain-controller-v732.js').read_text(); css=Path('collection-domain-controller-v732.css').read_text(); achievement=Path('achievement-domain-controller-v721.js').read_text()
          for required in ['const BUILD = "v73.2"','collectionDomainModeV732','function onsenItems','function castleItems','function scenicItems','data-common-status="unvisited"','collectionCommonPrefV732','function renderPrefectures','function renderList','温泉むすめ','地域資産','日本100名城','続100名城','特別名勝','function openOnMap','OnsenMapDomainV73?.open?.','window.OnsenCollectionDomainV732','achievementsVisible()']:
              assert required in common, required
          assert 'collection-common-row-v732' in css
          assert 'achievementDomainModeV721' in achievement
          print('v73.2 unified collection guards OK')
          PY

      - name: Release and regression guards
        run: |
          python - <<'PY'
          from pathlib import Path
          build=Path('build-info.js').read_text(); sw=Path('sw.js').read_text(); renderer=Path('scenic-map-renderer-v734.js').read_text()
          assert 'const version="v73.4"' in build
          assert './sw.js?v=73.4' in build
          assert 'onsen-checkin-v73.4' in sw
          assert './scenic-map-renderer-v734.js' in sw
          assert './map-domain-controller-v733.js' in sw
          assert './collection-domain-controller-v732.js' in sw and './collection-domain-controller-v732.css' in sw
          assert 'scenic-map-stability-v728.js' not in build and 'scenic-map-stability-v728.js' not in sw
          assert 'icon-image' not in renderer
          print('v73.4 release/regression guards OK')
          PY