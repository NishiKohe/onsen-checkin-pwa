name: Immersive four-domain map v73.6 regression

on:
  workflow_dispatch:
  push:
    paths:
      - "map-domain-controller-v736.js"
      - "map-immersive-v736.js"
      - "map-immersive-v736.css"
      - "scripts/test-map-immersive-v736.cjs"
      - "collection-domain-controller-v732.js"
      - "collection-map-navigation-v735.js"
      - "collection-domain-controller-v732.css"
      - "castle-map-v62.js"
      - "scenic-map-v71.js"
      - "scenic-map-renderer-v734.js"
      - "travel-domain-recovery-v728.js"
      - "photo-exif-runtime-v731.js"
      - "trip-manual-recovery-v731.js"
      - "trip-photo-recovery-v731.js"
      - "scenic-runtime-v70.js"
      - "achievement-domain-controller-v721.js"
      - "achievement-domain-v702.js"
      - "data/scenic-*.json"
      - "data/castle-checkin-zones-v62.json"
      - "data/castles-zoku100-v68.csv"
      - "build-info.js"
      - "sw.js"
      - ".github/workflows/scenic-v71-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for file in map-domain-controller-v736.js map-immersive-v736.js collection-domain-controller-v732.js collection-map-navigation-v735.js castle-map-v62.js scenic-map-v71.js scenic-map-renderer-v734.js travel-domain-recovery-v728.js photo-exif-runtime-v731.js trip-manual-recovery-v731.js trip-photo-recovery-v731.js scenic-runtime-v70.js build-info.js sw.js scripts/test-map-immersive-v736.cjs scripts/test-collection-map-navigation-v735.cjs; do node --check "$file"; done
      - name: Real controller transitions and navigation
        run: |
          node scripts/test-map-immersive-v736.cjs
          node scripts/test-collection-map-navigation-v735.cjs
      - name: GPS catalogs remain complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          master=json.loads(Path('data/scenic-official-v71.json').read_text())
          zones=json.loads(Path('data/scenic-checkin-zones-v71.json').read_text())
          supplement=json.loads(Path('data/scenic-checkin-supplement-v727.json').read_text())
          audit=json.loads(Path('data/scenic-checkin-audit-v72.json').read_text())
          multi=json.loads(Path('data/scenic-checkin-multizone-v724.json').read_text())
          assert master['counts']['total']==433 and len(master['entries'])==433
          effective={str(e['scenicId']):dict(e) for e in zones['entries']}
          for e in effective.values():
              if not e.get('checkinEnabled') and e.get('coordinateStatus')=='official_csv' and e.get('zones'): e['checkinEnabled']=True
          for layer in (supplement['entries'],audit['entries'],multi['entries']):
              for o in layer: effective[str(o['scenicId'])]={**effective[str(o['scenicId'])],**o}
          enabled=[e for e in effective.values() if e.get('checkinEnabled') and e.get('zones')]
          assert len(enabled)==433
          for e in enabled:
              for z in e['zones']:
                  assert float(z['radiusM'])>=500 and float(z['accuracyRequiredM'])>=500
          assert len(json.loads(Path('data/castle-checkin-zones-v62.json').read_text())['entries'])==100
          assert len([x for x in Path('data/castles-zoku100-v68.csv').read_text().splitlines()[1:] if x.strip()])==100
          print('GPS catalogs OK: scenic 433/433, castles 200')
          PY
      - name: Scene loading, exclusive renderer and screen composition
        run: |
          python - <<'PY'
          from pathlib import Path
          build=Path('build-info.js').read_text()
          sw=Path('sw.js').read_text()
          router=Path('map-domain-controller-v736.js').read_text()
          renderer=Path('scenic-map-renderer-v734.js').read_text()
          detail=Path('map-immersive-v736.js').read_text()
          css=Path('map-immersive-v736.css').read_text()
          assert 'const version="v73.6"' in build and './sw.js?v=73.6' in build
          assert 'onsen-checkin-v73.6' in sw
          for asset in ('map-domain-controller-v736.js','map-immersive-v736.js','map-immersive-v736.css','scenic-map-renderer-v734.js','collection-map-navigation-v735.js'):
              assert asset in build or asset in sw, asset
              assert asset in sw, asset
          for key in ('map-domain-controller-v736.js?v=73.6','scenic-map-renderer-v734.js?v=73.6','collection-map-navigation-v735.js?v=73.6','map-immersive-v736.js?v=73.6'):
              assert key in build, key
          assert build.index('const scenic=await ensureScenicAdapter()') < build.index('const renderer=await ensureScenicRenderer()') < build.index('collection-domain-controller-v732.js?v=73.6') < build.index('map-immersive-v736.js?v=73.6')
          assert 'const DOMAINS = ["all", "onsen", "castle", "scenic"]' in router
          assert 'mode === "all" || mode === domain' in router
          assert 'const canonicalScenic = layerExists("scenic-v734-points")' in router
          assert 'type: "circle"' in renderer and 'for (const entry of rt.entries())' in renderer
          assert 'lastFeatureCount = features.length' in renderer and 'lastFeatureCount === 433' in renderer
          assert 'mode() === "scenic" || mode() === "all"' in renderer
          assert 'function present(domain, id)' in detail and 'function close(reason' in detail
          assert 'grid-template-columns: none !important' in css
          assert 'scenic-map-stability-v728.js' not in build and 'scenic-map-stability-v728.js' not in sw
          print('v73.6 boot, exclusive 433-point renderer and full-viewport sheet guards OK')
          PY
      - name: Trip recovery, collections and achievements unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          recovery=Path('travel-domain-recovery-v728.js').read_text()
          exif=Path('photo-exif-runtime-v731.js').read_text()
          manual=Path('trip-manual-recovery-v731.js').read_text()
          photo=Path('trip-photo-recovery-v731.js').read_text()
          common=Path('collection-domain-controller-v732.js').read_text()
          achievement=Path('achievement-domain-controller-v721.js').read_text()
          nav=Path('collection-map-navigation-v735.js').read_text()
          for text in (recovery,exif,manual,photo): assert 'const BUILD = "v73.1"' in text
          for required in ['entityType==="onsen"?confirmOnsen','photo_verified_range','OnsenMapDomainV73?.open?.','upsertCandidate','window.OnsenTravelDomainRecoveryV731']:
              assert required in recovery,required
          for required in ['tripManualDomainV731','<option value="onsen">','<option value="castle">','<option value="scenic">','registerPastVisit']:
              assert required in manual,required
          for required in ['nearestOnsen','nearestCastles','nearestScenic','PHOTO_NEARBY_MARGIN_M = 1000','photo_verified_range','photo_nearby','upsertCandidate']:
              assert required in photo,required
          assert 'saveState(' not in photo and 'saveCheckins(' not in photo
          for required in ['const BUILD = "v73.2"','function onsenItems','function castleItems','function scenicItems','collectionCommonPrefV732','function renderPrefectures','function renderList','achievementsVisible()']:
              assert required in common,required
          assert 'achievementDomainModeV721' in achievement
          assert 'window.OnsenMapDetailV736?.present?.(request.domain, request.id)' in nav
          print('Trip v73.1, collection v73.2, achievement and map navigation guards OK')
          PY