name: Map domains v72 smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "map-domain-controller-v72.js"
      - "castle-map-v62.js"
      - "scenic-runtime-v70.js"
      - "scenic-map-v71.js"
      - "scenic-map-v71.css"
      - "scenic-v70-bridge.js"
      - "scenic-collection-ui-v70.js"
      - "scenic-collection-ui-v70.css"
      - "data/scenic-official-v71.json"
      - "data/scenic-checkin-zones-v71.json"
      - "build-info.js"
      - "sw.js"
      - ".github/workflows/scenic-v71-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check map-domain-controller-v72.js
          node --check castle-map-v62.js
          node --check scenic-runtime-v70.js
          node --check scenic-map-v71.js
          node --check scenic-v70-bridge.js
          node --check scenic-collection-ui-v70.js
          node --check build-info.js
          node --check sw.js

      - name: Scenic catalog integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          master = json.loads(Path('data/scenic-official-v71.json').read_text(encoding='utf-8'))
          zones = json.loads(Path('data/scenic-checkin-zones-v71.json').read_text(encoding='utf-8'))

          entries = master['entries']
          zone_entries = zones['entries']
          ids = [str(e['id']) for e in entries]
          zone_ids = [str(e['scenicId']) for e in zone_entries]
          manage_ids = [str(e['officialManageId']) for e in entries]

          assert master['counts']['ordinary'] == 397, master['counts']
          assert master['counts']['special'] == 36, master['counts']
          assert master['counts']['total'] == 433, master['counts']
          assert len(entries) == 433 and len(set(ids)) == 433
          assert len(set(manage_ids)) == 433, 'official manage ID collision'
          assert len(zone_entries) == 433 and len(set(zone_ids)) == 433
          assert set(zone_ids) == set(ids), 'zone/master ID mismatch'

          coord_entries = [e for e in entries if isinstance(e.get('lat'), (int,float)) and isinstance(e.get('lng'), (int,float))]
          enabled = [e for e in zone_entries if e.get('checkinEnabled')]
          assert len(coord_entries) == master['counts']['officialCoordinates'] == zones['counts']['officialCoordinates'] == 418
          assert len(enabled) == zones['counts']['gpsEnabled']
          assert len(enabled) >= 202, 'GPS coverage must not regress below initial safe set'
          assert zones['counts']['pendingMultiZoneOrAudit'] == 433 - len(enabled)

          for entry in zone_entries:
              zlist = entry.get('zones') or []
              if entry.get('checkinEnabled'):
                  assert zlist, f"enabled without zone: {entry['scenicId']}"
              for z in zlist:
                  assert float(z['radiusM']) >= 500, (entry['scenicId'], z)
                  assert float(z['accuracyRequiredM']) >= 500, (entry['scenicId'], z)
                  assert 20 <= float(z['lat']) <= 46.5, (entry['scenicId'], z)
                  assert 122 <= float(z['lng']) <= 154, (entry['scenicId'], z)

          print('official master: 397 ordinary + 36 special = 433 unique')
          print('official coordinates:', len(coord_entries))
          print('GPS enabled:', len(enabled))
          print('pending audit:', zones['counts']['pendingMultiZoneOrAudit'])
          PY

      - name: Canonical map router guards
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('map-domain-controller-v72.js').read_text(encoding='utf-8')
          for required in ['onsen:', 'castle:', 'scenic:', 'mapDomainModeV72', 'onsen-map-domain-v72-changed']:
              assert required in router, f'missing canonical router guard: {required}'
          assert 'event.isTrusted === false && applying' in router, 'synthetic scenic onsen click guard missing'

          bridge = Path('scenic-v70-bridge.js').read_text(encoding='utf-8')
          build = Path('build-info.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')

          assert 'const version = "v72"' in build
          assert './sw.js?v=72' in build
          assert './map-domain-controller-v72.js?v=72' in build
          assert './scenic-v70-bridge.js?v=72' in build
          assert './map-domain-controller-v72.js' in sw
          assert 'onsen-checkin-v72' in sw

          for text, label in [(build, 'build-info'), (bridge, 'scenic bridge'), (sw, 'service worker')]:
              assert 'scenic-map-hotfix-v712.js' not in text, f'legacy scenic JS hotfix still loaded by {label}'

          for required in [
              './data/scenic-official-v71.json',
              './data/scenic-checkin-zones-v71.json',
              './scenic-map-v71.js',
              './scenic-map-v71.css',
          ]:
              assert required in sw, f'missing SW core asset {required}'
          assert 'data/scenic-ordinary-' not in sw, 'legacy scenic shards must not be SW core assets'
          print('v72 canonical router guards OK')
          PY

      - name: Scenic safety guards
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('scenic-runtime-v70.js'),
              Path('scenic-map-v71.js'),
              Path('scenic-v70-bridge.js'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8')
              assert 'MutationObserver' not in text, f'MutationObserver forbidden in {p}'
              assert 'stopImmediatePropagation' not in text, f'stopImmediatePropagation forbidden in {p}'
          print('scenic safety guards OK')
          PY