<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="温泉チェックイン" />
  <title>温泉チェックイン</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <h1>温泉チェックイン</h1>
    <div class="stats">
      <span id="statTotal">訪問 0</span>
      <button id="btnLocate">現在地</button>
    </div>
  </header>

  <main class="main">
    <div id="map"></div>

    <section class="panel">
      <h2 id="spotTitle">スポットを選択</h2>
      <p id="spotSub">地図のピンをタップしてください</p>

      <div class="kv">
        <div><span>距離</span><b id="spotDist">-</b></div>
        <div><span>精度</span><b id="spotAcc">-</b></div>
      </div>

      <button id="btnCheckin" disabled>チェックイン</button>

      <details class="details">
        <summary>温泉分析（基本）</summary>
        <div class="grid" id="analysisGrid"></div>
        <p class="note" id="analysisNote"></p>
      </details>

      <details class="details">
        <summary>訪問履歴（この端末）</summary>
        <ul id="historyList" class="history"></ul>
      </details>
    </section>
  </main>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
