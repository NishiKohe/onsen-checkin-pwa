<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="温泉チェックイン" />
  <title>温泉チェックイン</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="./style.css?v=30" />
  <link rel="stylesheet" href="./collection-progress.css?v=30" />
  <link rel="stylesheet" href="./visit-log.css?v=30" />
</head>
<body>
  <header class="header">
    <h1>温泉チェックイン</h1>
    <div class="stats">
      <span id="statTotal">訪問 0</span>
      <button id="btnLocate">現在地</button>
    </div>
  </header>

  <main class="main">
    <div class="map-shell">
      <div id="map"></div>

      <div class="map-tools" aria-label="温泉検索と絞り込み">
        <div class="search-row">
          <input id="searchInput" type="search" list="searchSuggestions" placeholder="温泉名・温泉むすめ・都道府県で検索" autocomplete="off" />
          <datalist id="searchSuggestions"></datalist>
          <button id="btnClearSearch" class="tool-button" type="button" aria-label="検索をクリア">×</button>
        </div>

        <div class="filter-row">
          <select id="prefFilter" aria-label="都道府県で絞り込み">
            <option value="">全国</option>
          </select>
          <button class="filter-chip active" type="button" data-visit="all">すべて</button>
          <button class="filter-chip" type="button" data-visit="unvisited">未訪問</button>
          <button class="filter-chip" type="button" data-visit="visited">訪問済</button>
          <button class="filter-chip" type="button" data-tag="onsenMusume">温泉むすめ</button>
          <button class="filter-chip" type="button" data-tag="nationalRecreation">国民保養</button>
          <button class="filter-chip" type="button" data-tag="onsenHeritage">温泉遺産</button>
          <button class="filter-chip" type="button" data-tag="onsenArea">温泉郷</button>
          <button class="filter-chip" type="button" data-tag="legacy">レガシー</button>
          <button id="btnResetFilters" class="filter-chip reset-chip" type="button">リセット</button>
        </div>
        <div id="filterCount" class="filter-count">表示 —</div>
      </div>
    </div>

    <section class="panel">
      <h2 id="spotTitle">スポットを選択</h2>
      <p id="spotSub">地図のピンをタップしてください</p>
      <div id="spotTags" class="tag-list"></div>

      <div class="kv">
        <div><span>距離</span><b id="spotDist">-</b></div>
        <div><span>精度</span><b id="spotAcc">-</b></div>
      </div>

      <button id="btnCheckin" disabled>チェックイン</button>

      <details id="subAreasDetails" class="details" hidden>
        <summary>構成温泉・チェックイン地点</summary>
        <ul id="subAreasList" class="subarea-list"></ul>
      </details>

      <details class="details">
        <summary>温泉分析（基本）</summary>
        <div class="grid" id="analysisGrid"></div>
        <p class="note" id="analysisNote"></p>
      </details>

      <details class="details">
        <summary>訪問履歴（この端末）</summary>
        <ul id="historyList" class="history"></ul>
      </details>
    </section>
  </main>

  <section id="collectionView" class="collection-view" hidden aria-label="タグ達成状況">
    <div class="collection-shell">
      <div class="collection-header">
        <div>
          <span class="collection-eyebrow">COLLECTION</span>
          <h2>タグ達成状況</h2>
          <p id="collectionSummary">集計中…</p>
        </div>
      </div>

      <div class="collection-overview" aria-label="達成状況サマリー">
        <div class="collection-metric">
          <span>訪問温泉地</span>
          <b id="collectionVisitedMetric">0</b>
        </div>
        <div class="collection-metric">
          <span>コンプリート</span>
          <b id="collectionCompletedMetric">0/0</b>
        </div>
        <div class="collection-metric">
          <span>有効グループ称号</span>
          <b id="collectionGroupsMetric">0</b>
        </div>
      </div>

      <div class="collection-toolbar" aria-label="達成状況の絞り込み">
        <input id="collectionSearchInput" type="search" placeholder="称号・温泉名で絞り込み" autocomplete="off" />
        <div class="collection-filter-row">
          <button type="button" class="collection-filter active" data-collection-filter="all">すべて</button>
          <button type="button" class="collection-filter" data-collection-filter="incomplete">未完了</button>
          <button type="button" class="collection-filter" data-collection-filter="complete">達成済</button>
        </div>
      </div>

      <div id="collectionGrid" class="collection-grid"></div>
    </div>
  </section>

  <nav class="app-tabs" aria-label="画面切り替え">
    <button type="button" class="app-tab active" data-app-tab="map" aria-selected="true">地図</button>
    <button type="button" class="app-tab" data-app-tab="collection" aria-selected="false">達成状況</button>
  </nav>

  <script src="./visit-log-preload.js?v=30"></script>
  <script src="./app.js?v=30"></script>
  <script src="./ui-enhancements.js?v=30"></script>
  <script src="./heritage-ui.js?v=30"></script>
  <script src="./fixed-selection-ui.js?v=30"></script>
  <script src="./collection-progress-ui.js?v=30"></script>
  <script src="./tab-display-fix.js?v=30"></script>
  <script src="./visit-log-ui.js?v=30"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=30").catch(console.error);
      });
    }
  </script>
</body>
</html>
